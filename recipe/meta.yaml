# Draft Bioconda recipe - copy to bioconda/bioconda-recipes/recipes/captnseq-toolkit/meta.yaml
# once a release exists on PyPI, filling in the sha256 of the sdist.
{% set name = "captnseq-toolkit" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/captnseq_toolkit-{{ version }}.tar.gz
  sha256: REPLACE_ME

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation
  entry_points:
    - captnseq-toolkit = captnseq_toolkit.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=3.9
    - numpy
    - pandas
    - scipy
    - matplotlib-base

test:
  imports:
    - captnseq_toolkit
  commands:
    - captnseq-toolkit --version
    - captnseq-toolkit sam2sites --help
    - captnseq-toolkit sites2genes --help
    - captnseq-toolkit essentiality --help

about:
  home: https://github.com/simonjeanneau/captnseq-toolkit
  license: MIT
  license_file: LICENSE
  summary: Analysis tools for CAPTn-seq transposon-insertion sequencing data
